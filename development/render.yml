# Optional override: adds Grafana's image renderer so the README screenshot can be
# regenerated with `docker compose -f compose.yml -f render.yml up -d grafana renderer`.
services:
  grafana:
    environment:
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      GF_RENDERING_RENDERER_TOKEN: devtoken

  renderer:
    image: grafana/grafana-image-renderer:latest
    container_name: endoflife-renderer
    restart: unless-stopped
    environment:
      AUTH_TOKEN: devtoken
    networks:
      - monitoring
