---
networks:
  monitoring:
    name: monitoring
    attachable: true

volumes:
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data
  dashboards:
    name: dashboards

services:
  prometheus:
    image: prom/prometheus:latest
    hostname: prometheus
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    configs:
      - source: prometheus.yml
        target: /etc/prometheus/prometheus.yml
        mode: 0444
    volumes:
      - prometheus_data:/prometheus
    networks:
      - monitoring
    ports:
      - 9090:9090

  grafana:
    image: grafana/grafana:latest
    hostname: grafana
    container_name: grafana
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: changeme
      GF_AUTH_ANONYMOUS_ENABLED: true
    configs:
      - source: dashboard.yml
        target: /etc/grafana/provisioning/dashboards/dashboard.yml
        mode: 0444
      - source: datasource.yml
        target: /etc/grafana/provisioning/datasources/datasource.yml
        mode: 0444
    volumes:
      - grafana_data:/var/lib/grafana
      - dashboards:/etc/grafana/dashboards
    networks:
      - monitoring
    ports:
      - 3000:3000

  endoflifeexporter:
    build:
      context: .
      dockerfile: Dockerfile
    hostname: endoflifeexporter
    container_name: endoflifeexporter
    restart: unless-stopped
    depends_on:
      prometheus:
        condition: service_started
    environment:
      ADDRESS: ":8080"
      LOG_FORMAT: "console"
    networks:
      - monitoring
    ports:
      - 8080:8080

configs:
  datasource.yml:
    name: datasource.yml
    content: |
      ---
      apiVersion: 1

      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          orgId: 1
          url: http://prometheus:9090/
          basicAuth: false
          isDefault: true
          editable: true

  dashboard.yml:
    name: dashboard.yml
    content: |
      ---
      apiVersion: 1

      providers:
        - name: 'Prometheus'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          allowUiUpdates: true
          options:
            path: /etc/grafana/dashboards

  prometheus.yml:
    name: prometheus.yml
    content: |
      ---
      global:
        scrape_interval: 15s
        evaluation_interval: 15s
      scrape_configs:
        - job_name: "endoflifeexporter" # The exporter itself
          static_configs:
            - targets: ["endoflifeexporter:8080"]

        - job_name: "endoflife_products" # One scrape per product
          metrics_path: /probe
          scrape_interval: 168h
          scrape_timeout: 30s
          static_configs:
            - targets: ["mongo"]
              labels:
                releases: "8.0,7.0"
            - targets: ["redis"]
            - targets: ["ubuntu"]
              labels:
                releases: "all"
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - source_labels: [releases]
              target_label: __param_releases
            - target_label: __address__
              replacement: endoflifeexporter:8080
